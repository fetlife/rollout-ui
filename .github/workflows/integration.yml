name: CLI and API integration
on: [push, pull_request]
jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: gemfiles/integration.gemfile
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec rspec spec integration
