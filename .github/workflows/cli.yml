name: CLI

on: [push, pull_request]

jobs:
  cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ['3.1', '3.2', '3.3', '3.4']
    defaults:
      run:
        working-directory: rollout-cli
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          working-directory: rollout-cli
          bundler-cache: true
      - name: Test CLI
        run: bundle exec rake test
      - name: Build and smoke-test installed executable
        run: |
          gem build rollout-cli.gemspec
          gem install --local rollout-cli-*.gem --no-document
          rollout --help
          rollout --version

